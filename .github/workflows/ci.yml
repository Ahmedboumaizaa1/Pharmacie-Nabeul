name: CI

# Pull request, branche principale et tags vX.Y.Z
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  # --- 1. Tests (matrice de versions : Python 3.11 et 3.12) -------------------
  test:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest --junitxml=report-${{ matrix.python-version }}.xml
      - name: Rapport de tests en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-python-${{ matrix.python-version }}
          path: report-${{ matrix.python-version }}.xml

  # --- 2. Construction de l'image (seulement si les tests passent) ------------
  build:
    needs: test
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image en minuscules (exigé par GHCR)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  # --- 3. Publication : l'image du commit est re-étiquetée, jamais reconstruite
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Nom de l'image en minuscules (exigé par GHCR)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-étiqueter l'image du commit
        run: |
          docker pull "$IMAGE:${{ github.sha }}" || {
            echo "Image du commit introuvable : le tag doit pointer sur un commit de main déjà construit." >&2
            exit 1
          }
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:${{ github.ref_name }}"

  # --- 4. Mise en service en environnement de test + contrôle de santé --------
  deploy_test:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image en minuscules (exigé par GHCR)
        run: echo "APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mise en service
        run: ./scripts/deploy.sh "${{ github.ref_name }}"
