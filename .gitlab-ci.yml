stages:
  - test
  - build
  - release
  - deploy

# Le pipeline tourne sur merge request, sur la branche principale et sur les tags vX.Y.Z
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

variables:
  DOCKER_TLS_CERTDIR: ""

# --- 1. Tests (matrice de versions : Python 3.11 et 3.12) ---------------------
test:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12"]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - pip install --no-cache-dir -r requirements-dev.txt
    - pytest --junitxml=report-${PYTHON_VERSION}.xml
  artifacts:
    when: always
    paths:
      - report-*.xml
    reports:
      junit: report-*.xml

# --- 2. Construction de l'image (seulement si les tests passent) --------------
build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs: ["test"]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

# --- 3. Publication : l'image du commit est re-étiquetée, jamais reconstruite --
release:
  stage: release
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" || {
        echo "Image du commit $CI_COMMIT_SHA introuvable : le tag doit pointer sur un commit déjà construit (branche principale)." >&2
        exit 1
      }
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"

# --- 4. Mise en service en environnement de test + contrôle de santé ----------
deploy_test:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  needs: ["release"]
  environment:
    name: test
  variables:
    APP_IMAGE: $CI_REGISTRY_IMAGE
    HEALTH_URL: http://docker:8000/health
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache bash curl
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - ./scripts/deploy.sh "$CI_COMMIT_TAG"

# --- 5. Retour arrière : à lancer à la main sur le pipeline d'un tag ----------
rollback_test:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  needs: ["deploy_test"]
  environment:
    name: test
  when: manual
  allow_failure: true
  variables:
    APP_IMAGE: $CI_REGISTRY_IMAGE
    HEALTH_URL: http://docker:8000/health
    ROLLBACK_VERSION:
      value: "v1.0.0"
      description: "Version précédente vers laquelle revenir"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  before_script:
    - apk add --no-cache bash curl
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - ./scripts/deploy.sh "$ROLLBACK_VERSION"
